<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #e5e7eb;
      height: 100vh;
      overflow: hidden;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========== Top bar ========== */
    .topbar {
      height: 56px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }

    .topbar h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #60a5fa;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .upload-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .upload-area input[type="file"] {
      display: none;
    }

    .btn {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: #333;
      border-color: #555;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .btn.active {
      background: #1d4ed8;
      border-color: #3b82f6;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 4px;
    }

    .file-name {
      font-size: 13px;
      color: #94a3b8;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-text {
      font-size: 12.5px;
      color: #94a3b8;
      white-space: nowrap;
      margin-right: 8px;
    }

    /* Tools dropdown (right corner) */
    .tools-wrap {
      position: relative;
      margin-left: auto;
      flex-shrink: 0;
    }

    .btn-tools {
      width: 40px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 18px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #e5e7eb;
      cursor: pointer;
    }

    .btn-tools:hover,
    .btn-tools.open {
      background: #333;
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .tools-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      overflow: hidden;
      z-index: 200;
    }

    .tools-dropdown.open {
      display: block;
    }

    .tools-dropdown .dd-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 11px 14px;
      border: none;
      background: transparent;
      color: #e5e7eb;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .tools-dropdown .dd-item:hover {
      background: #2a2a2a;
    }

    .tools-dropdown .dd-item.active {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .tools-dropdown .dd-item .dd-desc {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .tools-dropdown .dd-divider {
      height: 1px;
      background: #333;
      margin: 4px 0;
    }

    /* ========== Main layout ========== */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .viewer-wrap {
      flex: 1;
      position: relative;
      background: #2a2a2a;
    }

    #viewer {
      width: 100%;
      height: 100%;
      cursor: default;
    }

    #viewer.hovering {
      cursor: pointer;
    }

    #viewer.measure-mode {
      cursor: crosshair;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
      color: #fff;
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .loading-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #444;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .measure-hud {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 15;
      background: rgba(15,15,15,0.9);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: #e5e7eb;
      max-width: 340px;
      pointer-events: none;
      display: none;
    }

    .measure-hud.visible {
      display: block;
    }

    .measure-hud .title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .measure-hud .dist {
      font-size: 18px;
      font-weight: 600;
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-bottom: 4px;
    }

    .measure-hud .deltas {
      font-size: 12px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.55;
    }

    .measure-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(37,99,235,0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    .measure-hint.visible {
      display: block;
    }

    /* Side panel */
    .side-panel {
      width: 300px;
      background: #1a1a1a;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      margin-right: 300px;
    }

    .panel-header {
      padding: 12px 14px;
      border-bottom: 1px solid #333;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-header span.count {
      background: #333;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #e5e7eb;
    }

    .panel-actions {
      display: flex;
      gap: 6px;
    }

    .node-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .node-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
      transition: background 0.12s;
    }

    .node-row:hover {
      background: #252525;
    }

    .node-row.active {
      background: #1e3a5f;
    }

    .node-row.auto-a {
      background: #1e3a5f;
      box-shadow: inset 3px 0 0 #3b82f6;
    }

    .node-row.auto-b {
      background: #3a2a1e;
      box-shadow: inset 3px 0 0 #f97316;
    }

    .node-row.hidden-part .name {
      color: #64748b;
      text-decoration: line-through;
    }

    .node-row .vis-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-row .vis-btn:hover {
      background: #333;
      color: #e5e7eb;
    }

    .node-row .vis-btn.off {
      color: #64748b;
      background: #1a1a1a;
    }

    .node-row .info {
      flex: 1;
      min-width: 0;
    }

    .node-row .name {
      font-size: 13px;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .node-row .meta {
      font-size: 11.5px;
      color: #94a3b8;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    .selected-info {
      border-top: 1px solid #333;
      padding: 14px;
      background: #141414;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
    }

    .selected-info h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 10px;
    }

    .selected-info .empty {
      color: #64748b;
      font-size: 12.5px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 6px 10px;
      align-items: start;
    }

    .detail-grid .label {
      color: #64748b;
      font-size: 12px;
    }

    .detail-grid .val {
      color: #e5e7eb;
      word-break: break-word;
      font-size: 12.5px;
    }

    .detail-grid .val.dims {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #93c5fd;
    }

    .detail-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    /* Right-click context menu */
    .ctx-menu {
    position: fixed;
    z-index: 9999;
    min-width: 180px;
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    padding: 4px 0;
    display: none;
    }

    .ctx-menu.open {
    display: block;
    }

    .ctx-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    border: none;
    background: transparent;
    color: #e5e7eb;
    font-size: 13px;
    cursor: pointer;
    }

.ctx-menu button:hover {
  background: #2a2a2a;
}

    @media (max-width: 900px) {
      .side-panel { width: 260px; }
    }

    @media (max-width: 700px) {
      .side-panel { width: 220px; }
      .topbar h1 { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <h1>3D Viewer</h1>

    <div class="upload-area">
      <input type="file" id="fileInput" accept=".glb,.gltf">
      <button class="btn" id="btnChoose">Choose GLB</button>
      <button class="btn btn-primary" id="btnRender" disabled>Render</button>
      <span class="file-name" id="fileName">No file selected</span>
    </div>

    <span class="status-text" id="status">Ready</span>

    <!-- Tools icon + dropdown (right corner) -->
    <div class="tools-wrap">
      <button class="btn-tools" id="btnTools" title="Measurement tools">⚙</button>
      <div class="tools-dropdown" id="toolsDropdown">
        <button class="dd-item" id="optManual">
          Manual Measure
          <span class="dd-desc">Click two points on the model</span>
        </button>
        <button class="dd-item" id="optAuto">
          Auto Measure
          <span class="dd-desc">Select two parts – distance calculated automatically</span>
        </button>
        <div class="dd-divider"></div>
        <button class="dd-item" id="optHoleDiameter">
          Hole Diameter
          <span class="dd-desc">Click 3+ points on the hole rim</span>
        </button>
        <button class="dd-item" id="optSurfaceToHole">
          Surface → Hole Center
          <span class="dd-desc">Click flat face, then 3 points on hole rim</span>
        </button>
        <button class="dd-item" id="optHoleToHole">
          Hole → Hole Center
          <span class="dd-desc">3 points on hole A, then 3 on hole B</span>
        </button>
        <div class="dd-divider"></div>
        <button class="dd-item" id="optClear">
          Clear Measurements
        </button>
        <button class="dd-item" id="optOff">
          Turn Off Measure Mode
        </button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="viewer-wrap">
      <div id="viewer"></div>
      <div class="measure-hint" id="measureHint"></div>
      <div class="measure-hud" id="measureHud">
        <div class="title" id="measureHudTitle">Measurement</div>
        <div class="dist" id="measureDist">—</div>
        <div class="deltas" id="measureDeltas"></div>
      </div>
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <span id="loadingText">Loading model…</span>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel-header">
        <span>Mesh Nodes <span class="count" id="nodeCount">0</span></span>
        <div class="panel-actions">
          <button class="btn btn-sm" id="btnShowAll">Show All</button>
          <button class="btn btn-sm" id="btnHideAll">Hide All</button>
        </div>
      </div>
      <div class="node-list" id="nodeList">
        <div class="empty-state">
          Upload a .glb / .gltf file<br>and click <strong>Render</strong>
        </div>
      </div>
      <div class="selected-info">
        <h3>Selected Part</h3>
        <div class="empty" id="selEmpty">Click a node in the list or on the model</div>
        <div id="selDetails" style="display:none;">
          <div class="detail-grid">
            <div class="label">Name</div>
            <div class="val" id="selName">—</div>
            <div class="label">Material</div>
            <div class="val" id="selMat">—</div>
            <div class="label">Dimensions</div>
            <div class="val dims" id="selDims">—</div>
            <div class="label">Vertices</div>
            <div class="val" id="selVerts">—</div>
            <div class="label">Visibility</div>
            <div class="val" id="selVis">—</div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-sm" id="btnToggleVis">Hide Part</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<div class="ctx-menu" id="ctxMenu">
  <button type="button" id="ctxHide">Hide this part</button>
  <button type="button" id="ctxShowOnly">Show only this part</button>
</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const UNIT_TO_MM = 1000;

    function toMM(v) {
      return v * UNIT_TO_MM;
    }

    function fmtMM(v, digits = 2) {
      return toMM(v).toFixed(digits) + ' mm';
    }

    function fmtMMRaw(v, digits = 2) {
      return toMM(v).toFixed(digits);
    }

    // DOM

    const fileInput   = document.getElementById('fileInput');
    const btnChoose   = document.getElementById('btnChoose');
    const btnRender   = document.getElementById('btnRender');
    const fileNameEl  = document.getElementById('fileName');
    const statusEl    = document.getElementById('status');
    const loadingEl   = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');
    const nodeListEl  = document.getElementById('nodeList');
    const nodeCountEl = document.getElementById('nodeCount');
    const selEmpty    = document.getElementById('selEmpty');
    const selDetails  = document.getElementById('selDetails');
    const selNameEl   = document.getElementById('selName');
    const selMatEl    = document.getElementById('selMat');
    const selDimsEl   = document.getElementById('selDims');
    const selVertsEl  = document.getElementById('selVerts');
    const selVisEl    = document.getElementById('selVis');
    const btnToggleVis = document.getElementById('btnToggleVis');
    const btnShowAll  = document.getElementById('btnShowAll');
    const btnHideAll  = document.getElementById('btnHideAll');
    const btnTools    = document.getElementById('btnTools');
    const toolsDropdown = document.getElementById('toolsDropdown');
    const optManual   = document.getElementById('optManual');
    const optAuto     = document.getElementById('optAuto');
    const optHoleDiameter = document.getElementById('optHoleDiameter');
    const optSurfaceToHole = document.getElementById('optSurfaceToHole');
    const optHoleToHole = document.getElementById('optHoleToHole');
    const optClear    = document.getElementById('optClear');
    const optOff      = document.getElementById('optOff');
    const measureHint = document.getElementById('measureHint');
    const measureHud  = document.getElementById('measureHud');
    const measureHudTitle = document.getElementById('measureHudTitle');
    const measureDist = document.getElementById('measureDist');
    const measureDeltas = document.getElementById('measureDeltas');
    const viewerEl    = document.getElementById('viewer');

    let selectedFile = null;

    // Three.js

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100000);
    camera.position.set(2, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewerEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = false;
    controls.enableZoom = false;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(5, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
    fillLight.position.set(-5, 3, -4);
    scene.add(fillLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(2000, 2000),
      new THREE.ShadowMaterial({ opacity: 0.15 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.001;
    ground.receiveShadow = true;
    scene.add(ground);

    // State

    const loader = new GLTFLoader();
    let currentRoot = null;
    let entries = [];
    let selectedIndex = -1;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredEntry = null;
    const HOVER_EMISSIVE = new THREE.Color(0x2266ff);
    const SELECT_EMISSIVE = new THREE.Color(0x00aa55);
    const AUTO_A_EMISSIVE = new THREE.Color(0x3b82f6);
    const AUTO_B_EMISSIVE = new THREE.Color(0xf97316);

    // Measure modes: null | 'manual' | 'auto' | 'hole_diameter' | 'surface_to_hole' | 'hole_to_hole'
    let measureMode = null;
    let measurePoints = [];
    let measurements = [];
    let autoPartA = -1;
    let autoPartB = -1;

    // Hole tool state
    let holePoints = [];           // rim points being collected
    let holePhase = 0;             // multi-step tools
    let surfacePlane = null;       // { point, normal } for surface→hole
    let holeCenterA = null;        // first hole center for hole→hole
    const HOLE_COLOR = 0xa78bfa;
    const HOLE_LINE_MAT = new THREE.LineBasicMaterial({ color: 0xa78bfa, depthWrite: false });
    const PLANE_COLOR = 0x22d3ee;

    const measureGroup = new THREE.Group();
    scene.add(measureGroup);

    const POINT_MAT = new THREE.MeshBasicMaterial({ color: 0xfbbf24, depthWrite: false });
    const LINE_MAT  = new THREE.LineBasicMaterial({ color: 0xfbbf24, depthWrite: false });
    const AUTO_LINE_MAT = new THREE.LineBasicMaterial({ color: 0x34d399, depthWrite: false });

    // Helpers

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showLoading(show, text = 'Loading model…') {
      loadingText.textContent = text;
      loadingEl.classList.toggle('visible', show);
    }

    function labelOf(mesh) {
      const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      const matNames = mats.filter(Boolean).map(m => m.name).filter(Boolean).join(', ');
      return (mesh.name || '(unnamed)') + (matNames ? '  [' + matNames + ']' : '');
    }

    function getMeshSize(mesh) {
      const box = new THREE.Box3().setFromObject(mesh);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { x: size.x, y: size.y, z: size.z };
    }

    function getMeshCenter(mesh) {
      const box = new THREE.Box3().setFromObject(mesh);
      const center = new THREE.Vector3();
      box.getCenter(center);
      return center;
    }

    function formatSizeMM(size) {
      return 'X = ' + fmtMMRaw(size.x) + '  ×  Y =  ' + fmtMMRaw(size.y) + '  ×  Z = ' + fmtMMRaw(size.z) + ' mm';
    }

    function getVertexCount(mesh) {
      if (!mesh.geometry) return 0;
      const pos = mesh.geometry.getAttribute('position');
      return pos ? pos.count : 0;
    }

    function setEmissive(mesh, color) {
      const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      mats.forEach(m => {
        if (!m || !m.emissive) return;
        m.emissive.copy(color);
        m.emissiveIntensity = (color.r === 0 && color.g === 0 && color.b === 0) ? 0 : 0.55;
      });
    }

    function clearEmissive(mesh) {
      setEmissive(mesh, new THREE.Color(0x000000));
    }

    function getVisibleMeshes() {
      return entries.filter(e => e.visible).map(e => e.mesh);
    }

    function updateMouse(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function raycastMeshes() {
      raycaster.setFromCamera(mouse, camera);
      return raycaster.intersectObjects(getVisibleMeshes(), false);
    }

    // Tools dropdown

    btnTools.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = toolsDropdown.classList.toggle('open');
      btnTools.classList.toggle('open', open);
    });

    document.addEventListener('click', () => {
      toolsDropdown.classList.remove('open');
      btnTools.classList.remove('open');
    });

    toolsDropdown.addEventListener('click', (e) => e.stopPropagation());

    function updateDropdownActive() {
      optManual.classList.toggle('active', measureMode === 'manual');
      optAuto.classList.toggle('active', measureMode === 'auto');
      optHoleDiameter.classList.toggle('active', measureMode === 'hole_diameter');
      optSurfaceToHole.classList.toggle('active', measureMode === 'surface_to_hole');
      optHoleToHole.classList.toggle('active', measureMode === 'hole_to_hole');
    }

    function closeToolsMenu() {
      toolsDropdown.classList.remove('open');
      btnTools.classList.remove('open');
    }

    optManual.addEventListener('click', () => {
      setMeasureMode('manual');
      closeToolsMenu();
    });

    optAuto.addEventListener('click', () => {
      setMeasureMode('auto');
      closeToolsMenu();
    });

    optHoleDiameter.addEventListener('click', () => {
      setMeasureMode('hole_diameter');
      closeToolsMenu();
    });

    optSurfaceToHole.addEventListener('click', () => {
      setMeasureMode('surface_to_hole');
      closeToolsMenu();
    });

    optHoleToHole.addEventListener('click', () => {
      setMeasureMode('hole_to_hole');
      closeToolsMenu();
    });

    optClear.addEventListener('click', () => {
      clearAllMeasurements();
      closeToolsMenu();
    });

    optOff.addEventListener('click', () => {
      setMeasureMode(null);
      closeToolsMenu();
    });

    // Smart zoom toward mouse

    function onWheel(event) {
      event.preventDefault();
      updateMouse(event);
      raycaster.setFromCamera(mouse, camera);

      let targetPoint = null;
      const hits = raycaster.intersectObjects(getVisibleMeshes(), false);

      if (hits.length > 0) {
        targetPoint = hits[0].point.clone();
      } else {
        const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(
          camera.getWorldDirection(new THREE.Vector3()).negate(),
          controls.target
        );
        targetPoint = new THREE.Vector3();
        if (!raycaster.ray.intersectPlane(plane, targetPoint)) {
          targetPoint = controls.target.clone();
        }
      }

      const factor = event.deltaY > 0 ? 1.12 : 0.88;
      const offset = camera.position.clone().sub(targetPoint);
      offset.multiplyScalar(factor);
      camera.position.copy(targetPoint).add(offset);

      const targetOffset = controls.target.clone().sub(targetPoint);
      targetOffset.multiplyScalar(factor);
      controls.target.copy(targetPoint).add(targetOffset);
      controls.update();
    }

    renderer.domElement.addEventListener('wheel', onWheel, { passive: false });

    // Collect meshes + side panel

    function collectMeshes(root) {
      entries = [];
      root.traverse(obj => {
        if (!obj.isMesh) return;
        const size = getMeshSize(obj);
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        const materialNames = mats.filter(Boolean).map(m => m.name || '(no name)').join(', ');
        entries.push({
          mesh: obj,
          name: obj.name || '(unnamed mesh)',
          fullLabel: labelOf(obj),
          materialNames,
          size,
          vertexCount: getVertexCount(obj),
          visible: true
        });
      });
      buildNodeList();
    }

    function buildNodeList() {
      nodeListEl.innerHTML = '';
      nodeCountEl.textContent = entries.length;

      if (entries.length === 0) {
        nodeListEl.innerHTML = '<div class="empty-state">No mesh nodes found</div>';
        return;
      }

      entries.forEach((entry, idx) => {
        const row = document.createElement('div');
        let cls = 'node-row' + (entry.visible ? '' : ' hidden-part');
        if (idx === selectedIndex && measureMode !== 'auto') cls += ' active';
        if (measureMode === 'auto') {
          if (idx === autoPartA) cls += ' auto-a';
          if (idx === autoPartB) cls += ' auto-b';
        }
        row.className = cls;
        row.dataset.index = idx;

        const visBtn = document.createElement('button');
        visBtn.className = 'vis-btn' + (entry.visible ? '' : ' off');
        visBtn.title = entry.visible ? 'Hide part' : 'Show part';
        visBtn.textContent = entry.visible ? '👁' : '👁‍🗨';
        visBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleVisibility(idx);
        });

        const info = document.createElement('div');
        info.className = 'info';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'name';
        nameDiv.title = entry.fullLabel;
        nameDiv.textContent = entry.name;

        const metaDiv = document.createElement('div');
        metaDiv.className = 'meta';
        metaDiv.innerHTML = '<span>' + formatSizeMM(entry.size) + '</span>';

        info.appendChild(nameDiv);
        info.appendChild(metaDiv);
        row.appendChild(visBtn);
        row.appendChild(info);
        row.addEventListener('click', () => onNodeClick(idx));
        nodeListEl.appendChild(row);
      });
    }

    function onNodeClick(idx) {
      if (measureMode === 'auto') {
        selectAutoPart(idx);
      } else {
        selectEntry(idx);
      }
    }

    function toggleVisibility(index) {
      const entry = entries[index];
      if (!entry) return;
      entry.visible = !entry.visible;
      entry.mesh.visible = entry.visible;
      buildNodeList();
      if (selectedIndex === index) updateSelectedPanel();
      setStatus(entry.visible ? 'Shown: ' + entry.name : 'Hidden: ' + entry.name);
    }

    function setAllVisibility(visible) {
      entries.forEach(e => {
        e.visible = visible;
        e.mesh.visible = visible;
      });
      buildNodeList();
      updateSelectedPanel();
      setStatus(visible ? 'All parts shown' : 'All parts hidden');
    }

    btnShowAll.addEventListener('click', () => setAllVisibility(true));
    btnHideAll.addEventListener('click', () => setAllVisibility(false));

    // Selection

    function selectEntry(index) {
      if (selectedIndex >= 0 && entries[selectedIndex]) {
        if (selectedIndex !== autoPartA && selectedIndex !== autoPartB) {
          clearEmissive(entries[selectedIndex].mesh);
        }
      }
      selectedIndex = index;
      const entry = entries[index];
      if (!entry) {
        selectedIndex = -1;
        updateSelectedPanel();
        return;
      }
      if (index !== autoPartA && index !== autoPartB) {
        setEmissive(entry.mesh, SELECT_EMISSIVE);
      }
      buildNodeList();
      updateSelectedPanel();
      setStatus('Selected: ' + entry.name);
    }

    function updateSelectedPanel() {
      if (selectedIndex < 0 || !entries[selectedIndex]) {
        selEmpty.style.display = 'block';
        selDetails.style.display = 'none';
        return;
      }
      const entry = entries[selectedIndex];
      selEmpty.style.display = 'none';
      selDetails.style.display = 'block';
      selNameEl.textContent = entry.name;
      selMatEl.textContent = entry.materialNames || '—';
      selDimsEl.textContent = formatSizeMM(entry.size);
      selVertsEl.textContent = entry.vertexCount.toLocaleString();
      selVisEl.textContent = entry.visible ? 'Visible' : 'Hidden';
      btnToggleVis.textContent = entry.visible ? 'Hide Part' : 'Show Part';
    }

    btnToggleVis.addEventListener('click', () => {
      if (selectedIndex >= 0) toggleVisibility(selectedIndex);
    });

    // Hover

    function onPointerMove(event) {
      if (!currentRoot || entries.length === 0) return;
      if (measureMode === 'manual' || measureMode === 'hole_diameter' ||
          measureMode === 'surface_to_hole' || measureMode === 'hole_to_hole') return;

      updateMouse(event);
      const intersects = raycastMeshes();

      if (hoveredEntry &&
          hoveredEntry !== entries[selectedIndex] &&
          entries.indexOf(hoveredEntry) !== autoPartA &&
          entries.indexOf(hoveredEntry) !== autoPartB) {
        clearEmissive(hoveredEntry.mesh);
      }
      hoveredEntry = null;
      viewerEl.classList.remove('hovering');

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const entry = entries.find(e => e.mesh === hitMesh);
        if (entry) {
          hoveredEntry = entry;
          viewerEl.classList.add('hovering');
          const idx = entries.indexOf(entry);
          if (idx !== selectedIndex && idx !== autoPartA && idx !== autoPartB) {
            setEmissive(entry.mesh, HOVER_EMISSIVE);
          }
        }
      }
    }

    function onPointerLeave() {
      if (hoveredEntry) {
        const idx = entries.indexOf(hoveredEntry);
        if (idx !== selectedIndex && idx !== autoPartA && idx !== autoPartB) {
          clearEmissive(hoveredEntry.mesh);
        }
      }
      hoveredEntry = null;
      viewerEl.classList.remove('hovering');
    }

    // Hole geometry helpers (circle fit on mesh points)

    function fitPlaneFromPoints(pts) {
      // Newell's method for plane normal + centroid
      const n = pts.length;
      if (n < 3) return null;
      const c = new THREE.Vector3();
      pts.forEach(p => c.add(p));
      c.divideScalar(n);

      let nx = 0, ny = 0, nz = 0;
      for (let i = 0; i < n; i++) {
        const cur = pts[i];
        const nxt = pts[(i + 1) % n];
        nx += (cur.y - nxt.y) * (cur.z + nxt.z);
        ny += (cur.z - nxt.z) * (cur.x + nxt.x);
        nz += (cur.x - nxt.x) * (cur.y + nxt.y);
      }
      const normal = new THREE.Vector3(nx, ny, nz);
      if (normal.lengthSq() < 1e-20) {
        // fallback: cross of first edges
        const e1 = pts[1].clone().sub(pts[0]);
        const e2 = pts[2].clone().sub(pts[0]);
        normal.crossVectors(e1, e2);
      }
      if (normal.lengthSq() < 1e-20) return null;
      normal.normalize();
      return { point: c, normal };
    }

    function buildPlaneBasis(normal) {
      const n = normal.clone().normalize();
      let tmp = Math.abs(n.x) < 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(n, tmp).normalize();
      const v = new THREE.Vector3().crossVectors(n, u).normalize();
      return { u, v, n };
    }

    function fitCircle3D(pts) {
      // Fit plane, project to 2D, algebraic circle fit (or exact for 3 pts)
      if (pts.length < 3) return null;
      const plane = fitPlaneFromPoints(pts);
      if (!plane) return null;
      const { u, v, n } = buildPlaneBasis(plane.normal);
      const origin = plane.point;

      const xy = pts.map(p => {
        const d = p.clone().sub(origin);
        return { x: d.dot(u), y: d.dot(v), p };
      });

      let cx, cy, r;
      if (pts.length === 3) {
        // Exact circumcircle in 2D
        const [a, b, c] = xy;
        const d = 2 * (a.x * (b.y - c.y) + b.x * (c.y - a.y) + c.x * (a.y - b.y));
        if (Math.abs(d) < 1e-14) return null;
        cx = ((a.x * a.x + a.y * a.y) * (b.y - c.y) +
              (b.x * b.x + b.y * b.y) * (c.y - a.y) +
              (c.x * c.x + c.y * c.y) * (a.y - b.y)) / d;
        cy = ((a.x * a.x + a.y * a.y) * (c.x - b.x) +
              (b.x * b.x + b.y * b.y) * (a.x - c.x) +
              (c.x * c.x + c.y * c.y) * (b.x - a.x)) / d;
        r = Math.hypot(a.x - cx, a.y - cy);
      } else {
        // Algebraic fit: x^2 + y^2 + D x + E y + F = 0
        let sxx = 0, syy = 0, sxy = 0, sx = 0, sy = 0, sx3 = 0, sy3 = 0, sxy2 = 0, syx2 = 0, n = xy.length;
        xy.forEach(({ x, y }) => {
          const x2 = x * x, y2 = y * y;
          sx += x; sy += y;
          sxx += x2; syy += y2; sxy += x * y;
          sx3 += x2 * x; sy3 += y2 * y;
          sxy2 += x * y2; syx2 += y * x2;
        });
        // Solve 2x2 for D, E from partial derivatives of sum (x^2+y^2+Dx+Ey+F)^2
        // Using Kasa method simplified
        const mx = sx / n, my = sy / n;
        let suu = 0, svv = 0, suv = 0, suuu = 0, svvv = 0, suvv = 0, svuu = 0;
        xy.forEach(({ x, y }) => {
          const u = x - mx, v = y - my;
          const uu = u * u, vv = v * v;
          suu += uu; svv += vv; suv += u * v;
          suuu += uu * u; svvv += vv * v;
          suvv += u * vv; svuu += v * uu;
        });
        const det = suu * svv - suv * suv;
        if (Math.abs(det) < 1e-14) return null;
        const uc = (svv * (suuu + suvv) - suv * (svvv + svuu)) / (2 * det);
        const vc = (suu * (svvv + svuu) - suv * (suuu + suvv)) / (2 * det);
        cx = uc + mx;
        cy = vc + my;
        r = Math.sqrt(uc * uc + vc * vc + (suu + svv) / n);
      }

      if (!isFinite(r) || r < 1e-12) return null;

      const center = origin.clone()
        .add(u.clone().multiplyScalar(cx))
        .add(v.clone().multiplyScalar(cy));

      return {
        center,
        radius: r,
        diameter: r * 2,
        normal: n.clone(),
        planePoint: origin.clone()
      };
    }

    function addHoleCircleVisual(fit, color = HOLE_COLOR) {
      const segs = 64;
      const { u, v } = buildPlaneBasis(fit.normal);
      const positions = [];
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const p = fit.center.clone()
          .add(u.clone().multiplyScalar(Math.cos(a) * fit.radius))
          .add(v.clone().multiplyScalar(Math.sin(a) * fit.radius));
        positions.push(p.x, p.y, p.z);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const line = new THREE.Line(
        geo,
        new THREE.LineBasicMaterial({ color, depthWrite: false })
      );
      line.renderOrder = 998;
      measureGroup.add(line);
      const marker = addPointMarker(fit.center, false, color);
      return { line, marker };
    }

    function resetHoleToolState() {
      holePoints = [];
      holePhase = 0;
      surfacePlane = null;
      holeCenterA = null;
      clearPendingPoint();
    }

    // Measure modes

    function setMeasureMode(mode) {
      // clean previous mode highlights
      if (autoPartA >= 0 && entries[autoPartA]) clearEmissive(entries[autoPartA].mesh);
      if (autoPartB >= 0 && entries[autoPartB]) clearEmissive(entries[autoPartB].mesh);
      autoPartA = -1;
      autoPartB = -1;
      measurePoints = [];
      resetHoleToolState();

      measureMode = mode;
      updateDropdownActive();
      const isPointPick = mode === 'manual' || mode === 'hole_diameter' ||
        mode === 'surface_to_hole' || mode === 'hole_to_hole';
      viewerEl.classList.toggle('measure-mode', isPointPick);

      if (mode === 'manual') {
        measureHint.textContent = 'Manual: click first point on the model';
        measureHint.classList.add('visible');
        setStatus('Manual measure – click two points');
      } else if (mode === 'auto') {
        measureHint.textContent = 'Auto: select first part (list or 3D view)';
        measureHint.classList.add('visible');
        setStatus('Auto measure – select two parts');
        buildNodeList();
      } else if (mode === 'hole_diameter') {
        measureHint.textContent = 'Hole diameter: click 3+ points on the hole rim';
        measureHint.classList.add('visible');
        setStatus('Hole diameter – pick points on rim (min 3)');
      } else if (mode === 'surface_to_hole') {
        measureHint.textContent = 'Surface → hole: click a point on a flat face';
        measureHint.classList.add('visible');
        setStatus('Surface → hole – click flat surface first');
        holePhase = 0;
      } else if (mode === 'hole_to_hole') {
        measureHint.textContent = 'Hole → hole: click 3 points on first hole rim';
        measureHint.classList.add('visible');
        setStatus('Hole → hole – pick 3 points on hole A');
        holePhase = 0;
      } else {
        measureHint.classList.remove('visible');
        setStatus('Measure mode off');
        buildNodeList();
      }
    }

    function clearPendingPoint() {
      const temps = measureGroup.children.filter(c => c.userData && c.userData.temp);
      temps.forEach(c => {
        measureGroup.remove(c);
        if (c.geometry) c.geometry.dispose();
      });
    }

    function getMarkerSize() {
      if (!currentRoot) return 0.02;
      const box = new THREE.Box3().setFromObject(currentRoot);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxSize = Math.max(size.x, size.y, size.z) || 1;
      return maxSize * 0.002;
    }

    function addPointMarker(position, temp = false, color = 0xfbbf24) {
      const geo = new THREE.SphereGeometry(getMarkerSize(), 12, 12);
      const mat = new THREE.MeshBasicMaterial({ color, depthWrite: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);
      mesh.renderOrder = 999;
      mesh.userData.temp = temp;
      measureGroup.add(mesh);
      return mesh;
    }

    function finishManualMeasurement(p1, p2) {
      const dist = p1.distanceTo(p2);
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dz = p2.z - p1.z;

      const positions = new Float32Array([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z]);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const line = new THREE.Line(lineGeo, LINE_MAT.clone());
      line.renderOrder = 998;
      measureGroup.add(line);

      const m1 = addPointMarker(p1);
      const m2 = addPointMarker(p2);

      measurements.push({ type: 'manual', p1: p1.clone(), p2: p2.clone(), line, markers: [m1, m2] });

      measureHudTitle.textContent = 'Manual Measurement';
      measureDist.textContent = fmtMM(dist);
      measureDeltas.innerHTML =
        'ΔX  ' + fmtMM(dx) + '<br>' +
        'ΔY  ' + fmtMM(dy) + '<br>' +
        'ΔZ  ' + fmtMM(dz);
      measureHud.classList.add('visible');
      setStatus('Distance: ' + fmtMM(dist));
    }

    // ---------- Auto measure: distance between two parts ----------
    function selectAutoPart(idx) {
      if (idx < 0 || idx >= entries.length) return;
      const entry = entries[idx];
      if (!entry.visible) {
        setStatus('Part is hidden – show it first');
        return;
      }

      if (autoPartA < 0) {
        autoPartA = idx;
        setEmissive(entry.mesh, AUTO_A_EMISSIVE);
        selectEntry(idx);
        measureHint.textContent = 'Auto: select second part';
        setStatus('Part A: ' + entry.name + ' – select second part');
        buildNodeList();
      } else if (autoPartB < 0) {
        if (idx === autoPartA) {
          setStatus('Select a different part for Part B');
          return;
        }
        autoPartB = idx;
        setEmissive(entry.mesh, AUTO_B_EMISSIVE);
        selectEntry(idx);
        computeAutoDistance();
        measureHint.textContent = 'Auto: result shown – click a part to start a new pair';
        buildNodeList();
      } else {
        // Starting a new pair: clear previous auto highlights
        if (autoPartA >= 0 && entries[autoPartA]) clearEmissive(entries[autoPartA].mesh);
        if (autoPartB >= 0 && entries[autoPartB]) clearEmissive(entries[autoPartB].mesh);
        autoPartA = idx;
        autoPartB = -1;
        setEmissive(entry.mesh, AUTO_A_EMISSIVE);
        selectEntry(idx);
        measureHint.textContent = 'Auto: select second part';
        setStatus('Part A: ' + entry.name + ' – select second part');
        buildNodeList();
      }
    }

    function computeAutoDistance() {
      if (autoPartA < 0 || autoPartB < 0) return;
      const a = entries[autoPartA];
      const b = entries[autoPartB];
      if (!a || !b) return;

      const c1 = getMeshCenter(a.mesh);
      const c2 = getMeshCenter(b.mesh);
      const dist = c1.distanceTo(c2);
      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;
      const dz = c2.z - c1.z;

      // Visual line between centers
      const positions = new Float32Array([c1.x, c1.y, c1.z, c2.x, c2.y, c2.z]);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const line = new THREE.Line(lineGeo, AUTO_LINE_MAT.clone());
      line.renderOrder = 998;
      measureGroup.add(line);

      const m1 = addPointMarker(c1, false, 0x3b82f6);
      const m2 = addPointMarker(c2, false, 0xf97316);

      measurements.push({
        type: 'auto',
        p1: c1.clone(),
        p2: c2.clone(),
        line,
        markers: [m1, m2],
        nameA: a.name,
        nameB: b.name
      });

      measureHudTitle.textContent = 'Auto Measure (center → center)';
      measureDist.textContent = fmtMM(dist);
      measureDeltas.innerHTML =
        '<span style="color:#93c5fd">A:</span> ' + a.name + '<br>' +
        '<span style="color:#fdba74">B:</span> ' + b.name + '<br><br>' +
        'ΔX  ' + fmtMM(dx) + '<br>' +
        'ΔY  ' + fmtMM(dy) + '<br>' +
        'ΔZ  ' + fmtMM(dz) + '<br><br>' +
        'A size: ' + formatSizeMM(a.size) + '<br>' +
        'B size: ' + formatSizeMM(b.size);
      measureHud.classList.add('visible');
      setStatus('Auto distance: ' + fmtMM(dist));

      // Reset for next pair after showing result
      // Keep highlights until user picks a new first part
    }

    function clearAllMeasurements() {
      while (measureGroup.children.length) {
        const c = measureGroup.children[0];
        measureGroup.remove(c);
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      }
      measurements = [];
      measurePoints = [];
      measureHud.classList.remove('visible');

      if (autoPartA >= 0 && entries[autoPartA]) clearEmissive(entries[autoPartA].mesh);
      if (autoPartB >= 0 && entries[autoPartB]) clearEmissive(entries[autoPartB].mesh);
      autoPartA = -1;
      autoPartB = -1;
      resetHoleToolState();

      if (measureMode === 'manual') {
        measureHint.textContent = 'Manual: click first point on the model';
        measureHint.classList.add('visible');
      } else if (measureMode === 'auto') {
        measureHint.textContent = 'Auto: select first part (list or 3D view)';
        measureHint.classList.add('visible');
        buildNodeList();
      } else if (measureMode === 'hole_diameter') {
        measureHint.textContent = 'Hole diameter: click 3+ points on the hole rim';
        measureHint.classList.add('visible');
      } else if (measureMode === 'surface_to_hole') {
        measureHint.textContent = 'Surface → hole: click a point on a flat face';
        measureHint.classList.add('visible');
        holePhase = 0;
      } else if (measureMode === 'hole_to_hole') {
        measureHint.textContent = 'Hole → hole: click 3 points on first hole rim';
        measureHint.classList.add('visible');
        holePhase = 0;
      }
      setStatus('Measurements cleared');
    }

    function onManualClick(event) {
      if (measureMode !== 'manual' || !currentRoot) return;
      updateMouse(event);
      const intersects = raycastMeshes();
      if (intersects.length === 0) {
        setStatus('Click on a visible part of the model');
        return;
      }
      const point = intersects[0].point.clone();

      if (measurePoints.length === 0) {
        measurePoints.push(point);
        clearPendingPoint();
        addPointMarker(point, true);
        measureHint.textContent = 'Manual: click second point';
        setStatus('First point set – click second point');
      } else {
        const p1 = measurePoints[0];
        clearPendingPoint();
        finishManualMeasurement(p1, point);
        measurePoints = [];
        measureHint.textContent = 'Manual: click first point on the model';
      }
    }

    function showHoleDiameterResult(fit) {
      const vis = addHoleCircleVisual(fit, HOLE_COLOR);
      measurements.push({ type: 'hole_diameter', fit, line: vis.line, marker: vis.marker });

      measureHudTitle.textContent = 'Hole Diameter';
      measureDist.textContent = fmtMM(fit.diameter);
      measureDeltas.innerHTML =
        'Diameter  ' + fmtMM(fit.diameter) + '<br>' +
        'Radius    ' + fmtMM(fit.radius) + '<br>' +
        'Points used: ' + holePoints.length;
      measureHud.classList.add('visible');
      setStatus('Hole Ø ' + fmtMM(fit.diameter));
    }

    function onHoleDiameterClick(event) {
      if (!currentRoot) return;
      updateMouse(event);
      const intersects = raycastMeshes();
      if (intersects.length === 0) {
        setStatus('Click on the hole rim');
        return;
      }
      const point = intersects[0].point.clone();
      holePoints.push(point);
      addPointMarker(point, true, HOLE_COLOR);

      if (holePoints.length < 3) {
        measureHint.textContent = 'Hole diameter: ' + holePoints.length + '/3 points – keep clicking rim';
        setStatus('Rim points: ' + holePoints.length + ' / 3 minimum');
        return;
      }

      const fit = fitCircle3D(holePoints);
      if (!fit) {
        setStatus('Could not fit circle – try points more spread on the rim');
        return;
      }

      clearPendingPoint();
      holePoints.forEach(p => addPointMarker(p, false, HOLE_COLOR));
      showHoleDiameterResult(fit);
      measureHint.textContent = 'Hole diameter: add more rim points to refine, or Clear for a new hole';
    }

    function onSurfaceToHoleClick(event) {
      if (!currentRoot) return;
      updateMouse(event);
      const intersects = raycastMeshes();
      if (intersects.length === 0) {
        setStatus('Click on the model');
        return;
      }
      const hit = intersects[0];
      const point = hit.point.clone();

      if (holePhase === 0) {
        let normal = hit.face ? hit.face.normal.clone() : new THREE.Vector3(0, 1, 0);
        const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
        normal.applyMatrix3(normalMatrix).normalize();
        surfacePlane = { point: point.clone(), normal };
        addPointMarker(point, false, PLANE_COLOR);
        const nEnd = point.clone().add(normal.clone().multiplyScalar(getMarkerSize() * 8));
        const pos = new Float32Array([point.x, point.y, point.z, nEnd.x, nEnd.y, nEnd.z]);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const nLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: PLANE_COLOR, depthWrite: false }));
        nLine.renderOrder = 998;
        measureGroup.add(nLine);
        measurements.push({ type: 'surface_plane', line: nLine });

        holePhase = 1;
        holePoints = [];
        measureHint.textContent = 'Surface set – click 3 points on the hole rim';
        setStatus('Flat surface captured – pick hole rim (3 points)');
        return;
      }

      holePoints.push(point);
      addPointMarker(point, true, HOLE_COLOR);

      if (holePoints.length < 3) {
        measureHint.textContent = 'Surface → hole: rim ' + holePoints.length + '/3';
        setStatus('Rim points: ' + holePoints.length + ' / 3');
        return;
      }

      const fit = fitCircle3D(holePoints);
      if (!fit) {
        setStatus('Could not fit hole circle – adjust rim points');
        return;
      }

      clearPendingPoint();
      holePoints.forEach(p => addPointMarker(p, false, HOLE_COLOR));
      const vis = addHoleCircleVisual(fit, HOLE_COLOR);

      const d = fit.center.clone().sub(surfacePlane.point).dot(surfacePlane.normal);
      const dist = Math.abs(d);

      const onPlane = fit.center.clone().sub(surfacePlane.normal.clone().multiplyScalar(d));
      const positions = new Float32Array([
        onPlane.x, onPlane.y, onPlane.z,
        fit.center.x, fit.center.y, fit.center.z
      ]);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const distLine = new THREE.Line(
        lineGeo,
        new THREE.LineBasicMaterial({ color: 0xfbbf24, depthWrite: false })
      );
      distLine.renderOrder = 998;
      measureGroup.add(distLine);
      addPointMarker(fit.center, false, HOLE_COLOR);

      measurements.push({ type: 'surface_to_hole', fit, dist, line: vis.line, distLine });

      measureHudTitle.textContent = 'Surface → Hole Center';
      measureDist.textContent = fmtMM(dist);
      measureDeltas.innerHTML =
        'Distance (plane → center)  ' + fmtMM(dist) + '<br>' +
        'Hole diameter  ' + fmtMM(fit.diameter) + '<br>' +
        'Hole radius    ' + fmtMM(fit.radius);
      measureHud.classList.add('visible');
      setStatus('Surface → hole: ' + fmtMM(dist));

      holePhase = 0;
      holePoints = [];
      surfacePlane = null;
      measureHint.textContent = 'Done – click a flat face to measure another (or Clear)';
    }

    function onHoleToHoleClick(event) {
      if (!currentRoot) return;
      updateMouse(event);
      const intersects = raycastMeshes();
      if (intersects.length === 0) {
        setStatus('Click on a hole rim');
        return;
      }
      const point = intersects[0].point.clone();
      holePoints.push(point);
      addPointMarker(point, true, holePhase === 0 ? 0x3b82f6 : 0xf97316);

      const need = 3;
      const label = holePhase === 0 ? 'Hole A' : 'Hole B';

      if (holePoints.length < need) {
        measureHint.textContent = label + ': ' + holePoints.length + '/' + need + ' rim points';
        setStatus(label + ' rim points: ' + holePoints.length + ' / ' + need);
        return;
      }

      const fit = fitCircle3D(holePoints);
      if (!fit) {
        setStatus('Could not fit circle on ' + label + ' – try again');
        holePoints = [];
        clearPendingPoint();
        return;
      }

      clearPendingPoint();
      const col = holePhase === 0 ? 0x3b82f6 : 0xf97316;
      holePoints.forEach(p => addPointMarker(p, false, col));
      addHoleCircleVisual(fit, col);

      if (holePhase === 0) {
        holeCenterA = fit.center.clone();
        measurements.push({ type: 'hole_a', fit });
        holePhase = 1;
        holePoints = [];
        measureHint.textContent = 'Hole A set – click 3 points on second hole rim';
        setStatus('Hole A Ø ' + fmtMM(fit.diameter) + ' – pick hole B');
        return;
      }

      const c1 = holeCenterA;
      const c2 = fit.center;
      const dist = c1.distanceTo(c2);
      const dx = c2.x - c1.x;
      const dy = c2.y - c1.y;
      const dz = c2.z - c1.z;

      const positions = new Float32Array([c1.x, c1.y, c1.z, c2.x, c2.y, c2.z]);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const line = new THREE.Line(
        lineGeo,
        new THREE.LineBasicMaterial({ color: 0x34d399, depthWrite: false })
      );
      line.renderOrder = 998;
      measureGroup.add(line);

      measurements.push({ type: 'hole_to_hole', c1: c1.clone(), c2: c2.clone(), line, dist });

      measureHudTitle.textContent = 'Hole Center → Hole Center';
      measureDist.textContent = fmtMM(dist);
      measureDeltas.innerHTML =
        'Center distance  ' + fmtMM(dist) + '<br>' +
        'ΔX  ' + fmtMM(dx) + '<br>' +
        'ΔY  ' + fmtMM(dy) + '<br>' +
        'ΔZ  ' + fmtMM(dz) + '<br>' +
        'Hole B diameter  ' + fmtMM(fit.diameter);
      measureHud.classList.add('visible');
      setStatus('Hole → hole: ' + fmtMM(dist));

      holePhase = 0;
      holePoints = [];
      holeCenterA = null;
      measureHint.textContent = 'Done – click 3 points on a hole to start again (or Clear)';
    }

    // Click handler

    function onPointerClick(event) {
      if (!currentRoot || entries.length === 0) return;

      if (measureMode === 'manual') {
        onManualClick(event);
        return;
      }

      if (measureMode === 'hole_diameter') {
        onHoleDiameterClick(event);
        return;
      }

      if (measureMode === 'surface_to_hole') {
        onSurfaceToHoleClick(event);
        return;
      }

      if (measureMode === 'hole_to_hole') {
        onHoleToHoleClick(event);
        return;
      }

      if (measureMode === 'auto') {
        updateMouse(event);
        const intersects = raycastMeshes();
        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          const idx = entries.findIndex(e => e.mesh === hitMesh);
          if (idx >= 0) selectAutoPart(idx);
        }
        return;
      }

      updateMouse(event);
      const intersects = raycastMeshes();
      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const idx = entries.findIndex(e => e.mesh === hitMesh);
        if (idx >= 0) selectEntry(idx);
      }
    }

    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerleave', onPointerLeave);
    renderer.domElement.addEventListener('click', onPointerClick);

    // Fit camera

    function fitCameraToObject(root) {
      const box = new THREE.Box3().setFromObject(root);
      if (box.isEmpty()) return;
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);
      const maxSize = Math.max(size.x, size.y, size.z) || 1;
      const fitHeightDistance = maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      const fitWidthDistance = fitHeightDistance / camera.aspect;
      const distance = 1.4 * Math.max(fitHeightDistance, fitWidthDistance);
      const dir = new THREE.Vector3(1, 0.7, 1).normalize();
      camera.position.copy(center).add(dir.multiplyScalar(distance));
      camera.near = Math.max(0.001, distance / 1000);
      camera.far = Math.max(1000, distance * 100);
      camera.updateProjectionMatrix();
      controls.target.copy(center);
      controls.minDistance = Math.max(maxSize * 0.05, 0.01);
      controls.maxDistance = Math.max(maxSize * 30, 10);
      controls.update();
    }

    // Load model

    function loadModel(url) {
      if (currentRoot) {
        scene.remove(currentRoot);
        currentRoot.traverse(obj => {
          if (obj.isMesh) {
            if (obj.geometry) obj.geometry.dispose();
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else if (obj.material) obj.material.dispose();
          }
        });
        currentRoot = null;
      }
      entries = [];
      selectedIndex = -1;
      hoveredEntry = null;
      clearAllMeasurements();
      setMeasureMode(null);
      buildNodeList();
      updateSelectedPanel();

      showLoading(true, 'Loading model…');
      setStatus('Loading…');

      loader.load(
        url,
        (gltf) => {
          currentRoot = gltf.scene;
          currentRoot.traverse(obj => {
            if (obj.isMesh) {
              obj.castShadow = true;
              obj.receiveShadow = true;
              const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
              mats.forEach(m => {
                if (m && !m.emissive) m.emissive = new THREE.Color(0x000000);
              });
            }
          });
          scene.add(currentRoot);
          collectMeshes(currentRoot);
          fitCameraToObject(currentRoot);
          showLoading(false);
          setStatus('Loaded • ' + entries.length + ' mesh node(s)');
        },
        (progress) => {
          if (progress.total) {
            const pct = (progress.loaded / progress.total * 100).toFixed(0);
            loadingText.textContent = 'Loading model… ' + pct + '%';
          }
        },
        (err) => {
          console.error(err);
          showLoading(false);
          setStatus('Failed to load model');
          alert('Failed to load the GLB file.');
        }
      );
    }

    // Upload

    btnChoose.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      fileNameEl.textContent = file.name;
      btnRender.disabled = false;
      setStatus('File selected – click Render');
    });

    btnRender.addEventListener('click', async () => {
      if (!selectedFile) return;
      btnRender.disabled = true;
      setStatus('Uploading…');
      showLoading(true, 'Uploading file…');
      const formData = new FormData();
      formData.append('file', selectedFile);
      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Upload failed');
        loadModel(data.url);
      } catch (err) {
        console.error(err);
        showLoading(false);
        setStatus('Upload failed');
        alert(err.message || 'Upload failed');
      } finally {
        btnRender.disabled = false;
      }
    });

    // Resize + loop

    function resize() {
      const w = viewerEl.clientWidth;
      const h = viewerEl.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ---------- Right-click context menu ----------
    const ctxMenu = document.getElementById('ctxMenu');
    const ctxHide = document.getElementById('ctxHide');
    const ctxShowOnly = document.getElementById('ctxShowOnly');
    let ctxIndex = -1;

    function hideCtxMenu() {
      ctxMenu.classList.remove('open');
      ctxIndex = -1;
    }

    function showCtxMenu(clientX, clientY, index) {
      ctxIndex = index;
      ctxMenu.style.left = clientX + 'px';
      ctxMenu.style.top = clientY + 'px';
      ctxMenu.classList.add('open');
    }

    // Right-click on the 3D canvas
    renderer.domElement.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      if (!currentRoot || entries.length === 0) return;

      updateMouse(event);
      const intersects = raycastMeshes();
      if (intersects.length === 0) {
        hideCtxMenu();
        return;
      }

      const hitMesh = intersects[0].object;
      const idx = entries.findIndex(e => e.mesh === hitMesh);
      if (idx < 0) {
        hideCtxMenu();
        return;
      }

      // Also select that part
      selectEntry(idx);
      showCtxMenu(event.clientX, event.clientY, idx);
    });

    // Close menu on normal click / scroll
    document.addEventListener('click', hideCtxMenu);
    document.addEventListener('wheel', hideCtxMenu, { passive: true });

    // Hide this part
    ctxHide.addEventListener('click', (e) => {
      e.stopPropagation();
      if (ctxIndex >= 0) {
        const entry = entries[ctxIndex];
        if (entry) {
          entry.visible = false;
          entry.mesh.visible = false;
          buildNodeList();
          if (selectedIndex === ctxIndex) updateSelectedPanel();
          setStatus('Hidden: ' + entry.name);
        }
      }
      hideCtxMenu();
    });

    // Show only this part
    ctxShowOnly.addEventListener('click', (e) => {
      e.stopPropagation();
      if (ctxIndex >= 0) {
        entries.forEach((entry, i) => {
          const show = (i === ctxIndex);
          entry.visible = show;
          entry.mesh.visible = show;
        });
        buildNodeList();
        updateSelectedPanel();
        setStatus('Showing only: ' + entries[ctxIndex].name);
      }
      hideCtxMenu();
    });
  </script>
</body>
</html>
