<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer – Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .intro-container {
      text-align: center;
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 2.5rem;
      background: linear-gradient(90deg, #60a5fa, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      margin-bottom: 2.5rem;
    }

    .logos img {
      max-height: 140px;
      max-width: 280px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      transition: transform 0.3s ease;
    }

    .logos img:hover {
      transform: scale(1.04);
    }

    .progress-bar {
      width: 220px;
      height: 4px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 auto;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 4px;
      animation: fillProgress 6s linear forwards;
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: 0.95rem;
      color: #94a3b8;
      letter-spacing: 0.04em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fillProgress {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* Soft background glow */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="intro-container">
    <h1>3D Viewer</h1>

    <div class="logos">
      <!-- Plastmoldtek logo -->
      <img
        src="{{ url_for('static', filename='images/plastmoldtek_logo-removebg-preview.png') }}"
        alt="Plastmoldtek"
      >

      <!-- Second logo -->
      <img
        src="{{ url_for('static', filename='images/login_footer.png') }}"
        alt="Partner Logo"
      >
    </div>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <p class="subtitle">Loading application…</p>
  </div>

  <script>
    // Redirect after 6 seconds (within 5–7s range)
    setTimeout(() => {
      window.location.href = "{{ url_for('main_app') }}";
    }, 6000);
  </script>
</body>
</html>
